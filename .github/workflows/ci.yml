name: CI

on:
  push:
    branches: ["develop", "ci/**"]
  pull_request:
    branches: ["develop"]

jobs:
  backend-tests:
    name: Backend - Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
