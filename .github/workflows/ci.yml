name: CI

on:
  push:
    branches: ["develop", "ci/**"]
  pull_request:
    branches: ["develop"]

jobs:
  backend-tests:
    name: Backend - Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare test config
        run: |
          if [ -f src/test/resources/application-test.properties.example ]; then
            cp src/test/resources/application-test.properties.example src/test/resources/application-test.properties
          else
            echo "Missing application-test.properties.example" >&2
            exit 1
          fi

      - name: Run tests
        run: ./mvnw test

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt

  frontend-build:
    name: Frontend - Build (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-app/guarderia-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web-app/guarderia-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --verbose

      - name: List dist output
        if: always()
        run: |
          echo "=== dist (if exists) ==="
          ls -la dist || true
          echo "=== dist/* (if exists) ==="
          ls -la dist/* || true

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-app/guarderia-frontend/dist/**