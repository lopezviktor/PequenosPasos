name: CI

on:
  push:
    branches: ["develop", "ci/**"]
  pull_request:
    branches: ["develop"]

jobs:
  backend-tests:
    name: Backend - Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare test config
        run: |
          if [ -f src/test/resources/application-test.properties.example ]; then
            cp src/test/resources/application-test.properties.example src/test/resources/application-test.properties
          else
            echo "Missing application-test.properties.example" >&2
            exit 1
          fi

      - name: Run tests
        run: ./mvnw test

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
