<div class="profile-container">
  <p-card header="{{ 'PERFIL.ENCABEZADO' | translate }}" styleClass="mb-3 profile-card">
    <div class="profile-content">
      <p><strong class="profile-label">{{ 'FORMULARIO.NOMBRE' | translate }}</strong>: {{ educador.nombre }}</p>
      <p><strong class="profile-label">{{ 'FORMULARIO.APELLIDOS' | translate }}</strong>: {{ educador.apellidos }}</p>
      <p><strong class="profile-label">{{ 'FORMULARIO.EMAIL' | translate }}</strong>: {{ educador.email }}</p>
      <p><strong class="profile-label">{{ 'FORMULARIO.TELEFONO' | translate }}</strong>: {{ educador.telefono }}</p>
    </div>
    <div class="profile-button">
      <button 
        pButton 
        type="button" 
        [label]="'PERFIL.CAMBIAR_CONTRASENA' | translate"
        icon="pi pi-lock" 
        class="sidebar-action"
        (click)="mostrarDialogoCambioPassword = true">
      </button>
    </div>

    <p-dialog header="{{ 'PERFIL.CAMBIAR_CONTRASENA' | translate }}" [(visible)]="mostrarDialogoCambioPassword" [modal]="true" [closable]="true" [style]="{width: '400px'}">
      <div class="p-fluid">
        <div class="p-field">
          <label for="nuevaContrasena">{{ 'PERFIL.NUEVA_CONTRASENA' | translate }}</label>
          <input id="nuevaContrasena" type="password" pInputText [(ngModel)]="nuevaContrasena" />
        </div>
        <div class="p-field">
          <label for="confirmarContrasena">{{ 'PERFIL.CONFIRMAR_CONTRASENA' | translate }}</label>
          <input id="confirmarContrasena" type="password" pInputText [(ngModel)]="confirmarContrasena" />
        </div>
      </div>
      <ng-template pTemplate="footer">
        <button pButton type="button" [label]="'BOTONES.CANCELAR' | translate" icon="pi pi-times" (click)="mostrarDialogoCambioPassword = false"></button>
        <button pButton type="button" [label]="'BOTONES.GUARDAR' | translate" icon="pi pi-check" (click)="cambiarContrasena()" [disabled]="nuevaContrasena !== confirmarContrasena"></button>
      </ng-template>
    </p-dialog>
  </p-card>
</div>
