<div class="page-header">
  <h2>👩🏼‍🏫 Educadores</h2>
  <button 
    *ngIf="authService.getTipoUsuarioFromToken() === 'ADMINISTRADOR'"
    pButton 
    label="Añadir educador" 
    icon="pi pi-plus" 
    class="p-button-outlined" 
    (click)="abrirDialogoParaNuevoEducador()">
  </button>
</div>

<app-educator-table 
  *ngIf="educators"
  [educators]="educators" 
  (editar)="editarEducador($event)"
  (eliminado)="eliminarEducador($event)">
</app-educator-table>

<p-dialog 
  *ngIf="authService.getTipoUsuarioFromToken() === 'ADMINISTRADOR'"
  header="{{ selectedEducator ? 'Editar educador' : 'Añadir educador' }}" 
  [(visible)]="mostrarDialogoEducador" 
  [modal]="true" 
  [style]="{ width: '500px' }"
  (onHide)="cancelarDialogoEducador()">
  
  <app-educator-form 
    [educator]="selectedEducator"
    (submitEducator)="guardarEducador($event)"
    (cancel)="cancelarDialogoEducador()"
    >
  </app-educator-form>
</p-dialog>
