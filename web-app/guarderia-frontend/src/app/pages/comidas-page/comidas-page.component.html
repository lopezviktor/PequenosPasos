<div class="page-header">
  <h2>🍽️ {{ 'SIDEBAR.COMIDAS' | translate }}</h2>
  <button
    pButton
    icon="pi pi-plus"
    [label]="'APP.ANADIR_COMIDA' | translate"
    class="p-button-outlined p-button-success"
    (click)="crearComida()"
  ></button>
</div>

<app-comida-table
  [comidas]="comidas"
  (editar)="editarComida($event)"
  (eliminado)="guardarComida()"
></app-comida-table>

<p-dialog
  [(visible)]="mostrarDialogo"
  [modal]="true"
  [style]="{ width: '40rem' }"
  [header]="comidaSeleccionada ? ('APP.EDITAR_COMIDA' | translate) : ('APP.NUEVA_COMIDA' | translate)"
  (onHide)="cerrarDialogo()"
>
  <app-comida-form
    [comidaEditando]="comidaSeleccionada"
    (formularioCerrado)="cerrarDialogo()"
    (comidaGuardada)="guardarComida()"
  ></app-comida-form>
</p-dialog>
