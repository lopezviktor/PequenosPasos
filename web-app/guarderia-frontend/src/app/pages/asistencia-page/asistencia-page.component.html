<div class="page-header">
  <h2>🗓️ {{ 'SIDEBAR.ASISTENCIA' | translate }}</h2>
  <button pButton type="button" [label]="'APP.NUEVA_ASISTENCIA' | translate" icon="pi pi-plus" class="p-button-outlined p-button-success" (click)="nuevaAsistencia()"></button>
</div>
<p-toast position="top-right"></p-toast>
<p-dialog 
  [header]="asistenciaSeleccionada ? ('APP.EDITAR_ASISTENCIA' | translate) : ('APP.NUEVA_ASISTENCIA' | translate)"
  [(visible)]="mostrarDialogo" 
  [modal]="true" 
  [style]="{ width: '60vw', height: '80vh' }"
  (onHide)="limpiarFormulario()"
>
<app-asistencia-form
  *ngIf="mostrarDialogo"
  [asistenciaEditando]="asistenciaSeleccionada"
  (formularioCerrado)="limpiarFormulario()"
  (asistenciaGuardada)="recargarTabla()">
</app-asistencia-form>
</p-dialog>

<app-asistencia-table (editar)="editarAsistencia($event)"></app-asistencia-table>
