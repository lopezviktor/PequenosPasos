<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Iniciar sesión</h2>

    <div class="p-field">
      <label for="email">Email</label>
      <input id="email" type="text" pInputText formControlName="email" />
      <small class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        El email es obligatorio.
      </small>
    </div>

    <div class="p-field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" pInputText formControlName="password" />
      <small class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        La contraseña es obligatoria.
      </small>
    </div>

    <button pButton type="submit" label="Entrar" [disabled]="loginForm.invalid"></button>
  </form>
</div>
