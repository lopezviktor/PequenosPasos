<div *ngIf="actividad" class="p-card p-fluid">
  <div class="p-card-header">
    <h2>Detalles de la Actividad</h2>
  </div>
  <div class="p-card-body">
    <p><strong>Nombre:</strong> {{ actividad.nombre }}</p>
    <p><strong>Descripción:</strong> {{ actividad.descripcion }}</p>
    <p><strong>Educador:</strong> {{ actividad.educadorNombre }}</p>
    <p><strong>Clase:</strong> {{ actividad.claseNombre }}</p>
    <p><strong>Fecha:</strong> {{ actividad.fecha }}</p>
    
    <h3>Niños Participantes</h3>
    <p-listbox 
        [options]="ninosOptions" 
        optionLabel="label"
        styleClass="w-full">
    </p-listbox>
  </div>
  <div class="p-card-footer">
    <button pButton label="Volver" icon="pi pi-arrow-left" (click)="volver()" class="p-button-secondary"></button>
  </div>
</div>
