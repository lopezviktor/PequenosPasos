<div class="mensajes-container neumorphic">
  <div class="conversaciones-lista neumorphic">
    <h3>{{ 'MENSAJES.CONVERSACIONES' | translate }}</h3>
    <button pButton type="button" label="{{ 'MENSAJES.NUEVA_CONVERSACION' | translate }}" icon="pi pi-plus" class="p-button-success"
            (click)="abrirNuevaConversacion()"></button>

    <ul>
      <li *ngFor="let c of conversaciones"
          (click)="abrirChat(c)"
          [ngClass]="{'activo': chatActivo && chatActivo.receptorId === c.receptorId}">
        <div class="nombreCompleto">{{ c.nombre }}</div>
      </li>
    </ul>
  </div>

  <div class="chat-activo neumorphic" *ngIf="chatActivo">
    <h3>{{ 'MENSAJES.CHAT_CON' | translate:{nombre: chatActivo.nombre} }}</h3>
    <app-chat
      [receptorId]="chatActivo.receptorId">
    </app-chat>
  </div>
</div>

<p-dialog class="nueva-conversacion-dialog" header="{{ 'MENSAJES.NUEVA_CONVERSACION' | translate }}" [(visible)]="dialogNuevaConversacion" [modal]="true">  
  <div class="p-fluid">
    <p-dropdown [options]="listaPadres" optionLabel="nombreCompleto" [(ngModel)]="nuevoReceptorId"
                [placeholder]="'MENSAJES.SELECCIONA_PADRE' | translate"></p-dropdown>

    <textarea rows="3" pInputTextarea [(ngModel)]="primerMensaje"
              [placeholder]="'MENSAJES.ESCRIBE_PRIMER_MENSAJE' | translate"></textarea>

    <div class="p-mt-3">
      <button pButton type="button" class="p-button-success" label="{{ 'MENSAJES.ENVIAR' | translate }}" icon="pi pi-send"
              (click)="enviarPrimerMensaje()"></button>
    </div>
  </div>
</p-dialog>
