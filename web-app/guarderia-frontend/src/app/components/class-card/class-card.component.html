<p-card header="{{ clase.nombre }}" styleClass="ui-card-shadow">
    <div>
      <strong>Educador:</strong> {{ clase.educador?.nombre }} {{ clase.educador?.apellidos }}
    </div>
    <div>
      <strong>Número de niños:</strong> {{ clase.ninos?.length || 0 }}
    </div>
    <button 
      pButton 
      label="Detalles"
      icon="pi pi-eye" 
      class="p-button-sm p-button-outlined p-button-info"
      (click)="onVerDetalles()">
    </button>
    <button 
    pButton 
      label="Editar"
      icon="pi pi-pencil" 
      class="p-button-sm p-button-outlined p-button-success" 
      (click)="onEditar()">
    </button>
    <button 
    pButton 
      label="Eliminar"
      icon="pi pi-trash" 
      class="p-button-sm p-button-outlined p-button-danger" 
      (click)="onEliminar()">
    </button>

  </p-card>
