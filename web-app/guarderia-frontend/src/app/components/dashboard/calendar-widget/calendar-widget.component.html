<div class="neumorphic-card">
  <div class="calendar-section">
    <p-datepicker [inline]="true" [showWeek]="false"></p-datepicker>
  </div>

  <div class="class-status">
    <div class="class-row" *ngFor="let clase of resumenPorClase">
      <span class="class-name">{{ clase.nombre }}</span>
      <div class="status">
        <div class="status-item"><span class="dot present"></span>{{ clase.presentes }}</div>
        <div class="status-item"><span class="dot absent"></span>{{ clase.comiendo }}</div>
        <div class="status-item"><span class="dot nap"></span>{{ clase.enSiesta }}</div>
      </div>
    </div>
  </div>

  <div class="calendar-legend">
    <div><span class="dot present"></span> Asistencia</div>
    <div><span class="dot absent"></span> Comida</div>
    <div><span class="dot nap"></span> En siesta</div>
  </div>
</div>
