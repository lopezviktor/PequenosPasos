<p-table 
  [value]="educators"
  [paginator]="true"
  [rows]="10"
  [globalFilterFields]="['nombre', 'apellidos', 'email']"
  [filters]="{ global: { value: globalFilter, matchMode: 'contains' } }"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Apellidos</th>
      <th>Email</th>
      <th>Teléfono</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-educator>
    <tr>
      <td>{{ educator.nombre }}</td>
      <td>{{ educator.apellidos }}</td>
      <td>{{ educator.email }}</td>
      <td>{{ educator.telefono }}</td>
      <td>
        <button pButton icon="pi pi-pencil" class="p-button-sm p-button-outlined p-button-success" (click)="editarEducador(educator)"></button>
        <button pButton icon="pi pi-trash" class="p-button-sm p-button-outlined p-button-danger" (click)="confirmarEliminar(educator)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
<p-confirmDialog></p-confirmDialog>
