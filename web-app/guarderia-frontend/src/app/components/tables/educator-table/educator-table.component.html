<p-table 
  [value]="educatorsFiltrados"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 20, 50]"
  [paginatorPosition]="'bottom'"
  [paginatorDropdownAppendTo]="'body'"
  currentPageReportTemplate="Mostrando {first} - {last} de {totalRecords} registros"
  [globalFilterFields]="['nombre', 'apellidos', 'email', 'telefono']"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="header">
    <tr>
      <th>{{ 'FORMULARIO.NOMBRE' | translate }}</th>
      <th>{{ 'FORMULARIO.APELLIDOS' | translate }}</th>
      <th>{{ 'FORMULARIO.EMAIL' | translate }}</th>
      <th>{{ 'FORMULARIO.TELEFONO' | translate }}</th>
      <th>{{ 'TABLA.ACCIONES' | translate }}</th>
    </tr>
    <tr>
      <th>
        <ng-container pKeyFilter="alpha">
          <span class="p-input-icon-left w-full">
            <i class="pi pi-search" style="margin-right: 0.5rem;"></i>
            <input pInputText type="text" [(ngModel)]="nombreFiltro" [placeholder]="'TABLA.FILTRAR_NOMBRE' | translate" class="p-inputtext p-inputtext-sm w-full" appendTo="body" />
          </span>
        </ng-container>
      </th>
      <th>
        <ng-container pKeyFilter="alpha">
          <span class="p-input-icon-left w-full">
            <input pInputText type="text" [(ngModel)]="apellidosFiltro" [placeholder]="'TABLA.FILTRAR_APELLIDOS' | translate" class="p-inputtext p-inputtext-sm w-full" appendTo="body" />
          </span>
        </ng-container>
      </th>
      <th>
        <ng-container pKeyFilter="email">
          <span class="p-input-icon-left w-full">
            <input pInputText type="text" [(ngModel)]="emailFiltro" [placeholder]="'TABLA.FILTRAR_EMAIL' | translate" class="p-inputtext p-inputtext-sm w-full" appendTo="body" />
          </span>
        </ng-container>
      </th>
      <th>
        <ng-container pKeyFilter="int">
          <span class="p-input-icon-left w-full">
            <input pInputText type="text" [(ngModel)]="telefonoFiltro" [placeholder]="'TABLA.FILTRAR_TELEFONO' | translate" class="p-inputtext p-inputtext-sm w-full" appendTo="body" />
          </span>
        </ng-container>
      </th>
      <th><button pButton icon="pi pi-times" class="p-button-sm p-button-secondary" (click)="limpiarFiltros()" [label]="'BOTONES.LIMPIAR' | translate"></button></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-educator>
    <tr>
      <td>{{ educator.nombre }}</td>
      <td>{{ educator.apellidos }}</td>
      <td>{{ educator.email }}</td>
      <td>{{ educator.telefono }}</td>
      <td *ngIf="authService.getTipoUsuarioFromToken() === 'ADMINISTRADOR'">
        <button pButton icon="pi pi-pencil" class="p-button-sm p-button-outlined p-button-success" (click)="editarEducador(educator)"></button>
        <button pButton icon="pi pi-trash" class="p-button-sm p-button-outlined p-button-danger" (click)="confirmarEliminar(educator)"></button>
      </td>
      <td *ngIf="authService.getTipoUsuarioFromToken() !== 'ADMINISTRADOR'">
        <span class="text-muted">Sin permisos</span>
      </td>
    </tr>
  </ng-template>
</p-table>
<p-confirmDialog></p-confirmDialog>
