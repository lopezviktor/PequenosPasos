<p-table 
[value]="higienesFiltradas" 
[paginator]="true" 
[stripedRows]="true"
[rows]="10" 
responsiveLayout="scroll">
  <ng-template pTemplate="header">
    <tr>
      <th>Niño</th>
      <th>Educador</th>
      <th>Fecha y hora</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
    <tr>
      <th>
        <p-dropdown 
          [options]="ninosUnicos"
          [(ngModel)]="ninoFiltro"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Filtrar niño"
          class="p-dropdown-sm w-full"
          [showClear]="true"
          appendTo="body">
        </p-dropdown>
      </th>
      <th>
        <p-dropdown 
          [options]="educadoresUnicos"
          [(ngModel)]="educadorFiltro"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Filtrar educador"
          class="p-dropdown-sm w-full"
          [showClear]="true"
          appendTo="body">
        </p-dropdown>
      </th>
      <th>
        <p-calendar 
          [(ngModel)]="fechaFiltro"
          dateFormat="dd/mm/yy"
          placeholder="Filtrar fecha"
          class="p-inputtext-sm w-full"
          [showIcon]="true"
          appendTo="body">
        </p-calendar>
      </th>
      <th>
        <p-dropdown 
          [options]="estadosDisponibles"
          [(ngModel)]="estadoFiltro"
          placeholder="Filtrar estado"
          class="p-dropdown-sm w-full"
          [showClear]="true"
          appendTo="body">
        </p-dropdown>
      </th>
      <th>
        <button
          pButton
          icon="pi pi-times"
          class="p-button-sm p-button-secondary w-full"
          (click)="limpiarFiltros()"
          label="Limpiar">
        </button>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-higiene>
    <tr>
      <td>{{ higiene.nino?.nombre }} {{ higiene.nino?.apellidos }}</td>
      <td>{{ higiene.educador?.nombre }} {{ higiene.educador?.apellidos }}</td>
      <td>{{ higiene.fechaHora | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ higiene.estado }}</td>
      <td>
        <button pButton 
          icon="pi pi-pencil"
          class="p-button-sm p-button-outlined p-button-success"
          (click)="editarHigiene(higiene)">
        </button>
        <button pButton 
          icon="pi pi-trash"
          class="p-button-sm p-button-outlined p-button-danger"
          (click)="eliminarHigiene(higiene.id)">
        </button>
      </td>
    </tr>
  </ng-template>
</p-table>
<p-confirmDialog></p-confirmDialog>
