<p-table 
  [value]="parents"
  [paginator]="true"
  [rows]="10"
  [globalFilterFields]="['nombre', 'apellidos', 'email']"
  [filters]="{ global: { value: globalFilter, matchMode: 'contains' } }"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Apellidos</th>
      <th>Email</th>
      <th>Teléfono</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-parent>
    <tr>
      <td>{{ parent.nombre }}</td>
      <td>{{ parent.apellidos }}</td>
      <td>{{ parent.email }}</td>
      <td>{{ parent.telefono }}</td>
      <td>
        <button icon="pi pi-pencil" pButton pTooltip="Editar" class="p-button-rounded p-button-text"></button>
        <button icon="pi pi-trash" pButton pTooltip="Eliminar" class="p-button-rounded p-button-text p-button-danger"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
