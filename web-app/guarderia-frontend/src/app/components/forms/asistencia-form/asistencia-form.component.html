<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="p-field">
    <div class="p-float-label">
      <p-dropdown 
        inputId="nino"
        [options]="ninos"
        optionLabel="nombre"
        formControlName="nino">
      </p-dropdown>
      <label for="nino">Niño</label>
    </div>
  </div>

  <div class="p-field">
    <div class="p-float-label">
      <p-calendar 
        inputId="horaEntrada"
        formControlName="horaEntrada"
        [showTime]="true"
        hourFormat="24">
      </p-calendar>
      <label for="horaEntrada">Hora de entrada</label>
    </div>
  </div>

  <div class="p-field">
    <div class="p-float-label">
      <p-dropdown 
        inputId="padreEntrega"
        [options]="padresEntrega"
        optionLabel="nombreCompleto"
        formControlName="padreEntrega">
      </p-dropdown>
      <label for="padreEntrega">Padre que entrega</label>
    </div>
  </div>

  <div class="p-field">
    <div class="p-float-label">
      <p-dropdown 
        inputId="educadorRecibe"
        [options]="educadores"
        [optionLabel]="'nombre'"
        formControlName="educadorRecibe">
        <ng-template let-educador pTemplate="item">
          {{ educador.nombre }} {{ educador.apellidos }}
        </ng-template>
      </p-dropdown>
      <label for="educadorRecibe">Educador que recibe</label>
    </div>
  </div>

  <div class="p-field">
    <div class="p-float-label">
      <p-calendar 
        inputId="horaSalida"
        formControlName="horaSalida"
        [showTime]="true"
        hourFormat="24">
      </p-calendar>
      <label for="horaSalida">Hora de salida</label>
    </div>
  </div>

  <div class="p-field">
    <div class="p-float-label">
      <p-dropdown 
        inputId="educadorEntrega"
        [options]="educadores"
        [optionLabel]="'nombre'"
        formControlName="educadorEntrega">
        <ng-template let-educador pTemplate="item">
          {{ educador.nombre }} {{ educador.apellidos }}
        </ng-template>
      </p-dropdown>
      <label for="educadorEntrega">Educador que entrega</label>
    </div>
  </div>

  <div class="p-field">
    <div class="p-float-label">
      <p-dropdown 
        inputId="padreRecoge"
        [options]="padresRecoge"
        optionLabel="nombreCompleto"
        formControlName="padreRecoge">
      </p-dropdown>
      <label for="padreRecoge">Padre que recoge</label>
    </div>
  </div>

  <div style="display: flex; gap: 1rem; margin-top: 1rem; justify-content: center;">
    <button type="submit" pButton [disabled]="form.invalid">
      {{ isEditing ? 'Actualizar Asistencia' : 'Guardar Asistencia' }}
    </button>
    <button type="button" pButton class="p-button-secondary" (click)="formularioCerrado.emit()">
      Cancelar
    </button>
  </div>
</form>
