<form [formGroup]="parentForm" (ngSubmit)="onSubmit()" class="parent-form p-fluid">
  <div class="p-grid p-formgrid">

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <input id="nombre" type="text" pInputText formControlName="nombre" />
        <label for="nombre">Nombre</label>
      </div>
      <small *ngIf="parentForm.get('nombre')?.invalid && parentForm.get('nombre')?.touched" class="p-error">El nombre es obligatorio</small>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <input id="apellidos" type="text" pInputText formControlName="apellidos" />
        <label for="apellidos">Apellidos</label>
      </div>
      <small *ngIf="parentForm.get('apellidos')?.invalid && parentForm.get('apellidos')?.touched" class="p-error">Los apellidos son obligatorios</small>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <input id="email" type="email" pInputText formControlName="email" />
        <label for="email">Email</label>
      </div>
      <small *ngIf="parentForm.get('email')?.invalid && parentForm.get('email')?.touched" class="p-error">El email no es válido</small>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <input id="telefono" type="text" pInputText formControlName="telefono" />
        <label for="telefono">Teléfono</label>
      </div>
      <small *ngIf="parentForm.get('telefono')?.invalid && parentForm.get('telefono')?.touched" class="p-error">El teléfono es obligatorio</small>
    </div>

    <div class="p-field p-col-12" *ngIf="!parent">
      <div class="p-float-label">
        <input id="password" type="password" pInputText formControlName="password" />
        <label for="password">Contraseña</label>
      </div>
      <small *ngIf="parentForm.get('password')?.invalid && parentForm.get('password')?.touched" class="p-error">La contraseña es obligatoria</small>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <input id="tipoUsuario" type="text" pInputText [value]="'PADRE'" readonly />
        <label for="tipoUsuario">Tipo de usuario</label>
      </div>
      <small class="p-text-secondary">Este campo es informativo</small>
    </div>

  </div>

  <div class="p-d-flex p-jc-center p-mt-3">
    <button pButton type="submit" [label]="parent ? 'Actualizar padre' : 'Guardar padre'" class="p-button-success"></button>
  </div>
</form>
