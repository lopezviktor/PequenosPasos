<form [formGroup]="educatorForm" (ngSubmit)="onSubmit()" class="educator-form p-fluid">
  <div class="p-grid p-formgrid">

    <div class="p-field p-col-12 p-md-6">
      <div class="p-float-label">
        <input id="nombre" type="text" pInputText formControlName="nombre" />
        <label for="nombre">Nombre</label>
      </div>
      <small *ngIf="educatorForm.get('nombre')?.invalid && educatorForm.get('nombre')?.touched" class="p-error">El nombre es obligatorio</small>
    </div>

    <div class="p-field p-col-12 p-md-6">
      <div class="p-float-label">
        <input id="apellidos" type="text" pInputText formControlName="apellidos" />
        <label for="apellidos">Apellidos</label>
      </div>
      <small *ngIf="educatorForm.get('apellidos')?.invalid && educatorForm.get('apellidos')?.touched" class="p-error">Los apellidos son obligatorios</small>
    </div>

    <div class="p-field p-col-12 p-md-6">
      <div class="p-float-label">
        <input id="email" type="email" pInputText formControlName="email" />
        <label for="email">Email</label>
      </div>
      <small *ngIf="educatorForm.get('email')?.invalid && educatorForm.get('email')?.touched" class="p-error">El email no es válido</small>
    </div>

    <div class="p-field p-col-12 p-md-6">
      <div class="p-float-label">
        <input id="telefono" type="text" pInputText formControlName="telefono" />
        <label for="telefono">Teléfono</label>
      </div>
      <small *ngIf="educatorForm.get('telefono')?.invalid && educatorForm.get('telefono')?.touched" class="p-error">El teléfono es obligatorio</small>
    </div>

    <div class="p-field p-col-12 p-md-6" *ngIf="!educator">
      <div class="p-float-label">
        <input id="password" type="password" pInputText formControlName="password" />
        <label for="password">Contraseña</label>
      </div>
      <small *ngIf="educatorForm.get('password')?.errors?.['required'] && educatorForm.get('password')?.touched" class="p-error">La contraseña es obligatoria</small>
      <small *ngIf="educatorForm.get('password')?.errors?.['minlength'] && educatorForm.get('password')?.touched" class="p-error">La contraseña debe tener al menos 6 caracteres</small>
    </div>

    <div class="p-field p-col-12 p-md-6">
      <div class="p-float-label">
        <input id="tipoUsuario" type="text" pInputText [value]="'EDUCADOR'" readonly />
        <label for="tipoUsuario">Tipo de usuario</label>
      </div>
      <small class="p-text-secondary">Este campo es informativo</small>
    </div>
  </div>

  <div class="p-d-flex p-jc-end p-mt-3">
    <button pButton type="submit" [label]="educator ? 'Actualizar educador' : 'Guardar educador'" class="p-button-success"></button>
  </div>
</form>
