<form [formGroup]="form" (ngSubmit)="onSubmit()" class="comida-form p-fluid">
  <div class="p-grid p-formgrid">

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <p-dropdown
          inputId="nino"
          [options]="ninos"
          formControlName="nino"
          dataKey="id">
          <ng-template let-nino pTemplate="item">
            {{ nino | nombreCompleto }}
          </ng-template>
          <ng-template let-nino pTemplate="selectedItem">
            {{ nino | nombreCompleto }}
          </ng-template>
        </p-dropdown>
        <label for="nino">Niño</label>
      </div>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <p-dropdown
          inputId="educador"
          [options]="educadores"
          formControlName="educador"
          dataKey="id">
          <ng-template let-educador pTemplate="item">
            {{ educador | nombreCompleto }}
          </ng-template>
          <ng-template let-educador pTemplate="selectedItem">
            {{ educador | nombreCompleto }}
          </ng-template>
        </p-dropdown>
        <label for="educador">Educador</label>
      </div>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <p-calendar
          inputId="horaComida"
          formControlName="horaComida"
          [showTime]="true"
          hourFormat="24"
          >
        </p-calendar>
        <label for="horaComida">Hora de la comida</label>
      </div>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <textarea
          id="descripcionComida"
          pInputTextarea
          formControlName="descripcionComida"
          rows="3">
        </textarea>
        <label for="descripcionComida">Descripción de la comida</label>
      </div>
    </div>

    <div class="p-field p-col-12">
      <div class="p-float-label">
        <textarea
          id="observaciones"
          pInputTextarea
          formControlName="observaciones"
          rows="2"
          class="w-full">
          >
        </textarea>
        <label for="observaciones">Observaciones (opcional)</label>
      </div>
    </div>

  </div>

  <div class="p-d-flex p-jc-center p-mt-3">
    <button
      pButton
      type="submit"
      [label]="comidaEditando ? 'Actualizar comida' : 'Guardar comida'"
      class="p-button-success"
      [disabled]="form.invalid">
    </button>
  </div>
</form>
